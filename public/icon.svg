<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88524"/>
      <stop offset="100%" stop-color="#db7016"/>
    </linearGradient>
  </defs>
  
  <!-- Orange Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#orangeGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#fbd3a2" stroke-width="6" stroke-opacity="0.5"/>
  
  <!-- Chinese Character '台' in Songti/MingTi Serif Style -->
  <text 
    x="50%" 
    y="56%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#ffffff" 
    font-family="'Noto Serif TC', 'Songti SC', 'STSong', 'Source Han Serif TC', 'PingFang TC', serif" 
    font-weight="900" 
    font-size="340"
    letter-spacing="-0.02em"
  >台</text>
</svg>
